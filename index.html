<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Dashboard</title>
    <link rel = "icon" type = "image" href = 'New Project.png'>
<style>
    body {
        background-color: #000000;
    }
    
    .secondary {
        color: #BC0202;
        font-family: sans-serif;

    }

    
    .Github {
        position:absolute;
        top:  20px;
        right: 20px;
        font-weight: bold;
    }

    .Secondary-Holder {
        border : 2px solid #FF0000;
    }

    .main {
        color: #830000;
        display: flex;
        align-items: center;
        font-weight: bold;
        font-family: sans-serif;
        align-items: center;
    }

    .Main-Holder {
        border-radius: 4.2px;
        border: 2px solid #FF0000;
    }

    .news-card {
        border-bottom: 1px solid #FF0000;
        border-radius: 3px;
    }

    .news-card p {
        color: white

    }

    .Date {
        color: #830000;
        position: fixed;
        bottom: 20px;
        right: 20px;
        font-weight: bold;
        font-size: 15px
    }

    .Finance {
        border-radius: 2px;
        border: 2px solid #FF0000;
        color: #BC0202;
        font-family: sans-serif;
        font-weight: bold;
    }

    .finac {
        color: #BC0202;
        font-family: sans-serif;
        font-weight: bold;
    }
</style>
</head>
<body>

    <a href="https://github.com/shreyanshlakra724-sketch/All-in-One-News-Dashboard" class ="Github">
        <img src = "images.png" width="30" height = "30">
    </a>


    <div class ="Main-Holder">
    <h1 class="main">Main News</h1>
    </div>

    <div class = "Secondary-Holder">
    <h3 class="secondary">Top Headlines</h3>
    </div>

    <div class = "Date">

    </div>

    <div class = "Finance">
        <h1 class = "finac">Finance</h1>
    </div>


    <Script src = "config.js"></Script>
    <script src ="script.js"></script>
</body>
</html>
